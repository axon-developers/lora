server:
    host: 0.0.0.0
    port: 8080
    cors_origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
database:
    path: ./data/lora.db
clusters:
    - id: dev
      name: Development Cluster
      environment: development
      managed_kubeconfig: true
      kubeconfig:
        path: ""
        context: ""
      kconnect:
        enabled: true
        command: kconnect
        args:
            - use
            - eks
            - --cluster
            - dev-eks-cluster
        auto_refresh: true
        env: {}
      health_check_interval: 30s
      enabled: true
    - id: staging
      name: Staging Cluster
      environment: staging
      managed_kubeconfig: true
      kubeconfig:
        path: ""
        context: ""
      kconnect:
        enabled: true
        command: kconnect
        args:
            - use
            - eks
            - --cluster
            - staging-eks-cluster
        auto_refresh: true
        env: {}
      health_check_interval: 30s
      enabled: true
    - id: prod
      name: Production Cluster
      environment: production
      managed_kubeconfig: true
      kubeconfig:
        path: ""
        context: ""
      kconnect:
        enabled: true
        command: kconnect
        args:
            - use
            - eks
            - --cluster
            - prod-eks-cluster
        auto_refresh: false
        env: {}
      health_check_interval: 60s
      enabled: true
streaming:
    default_tail_lines: 500
    ring_buffer_max_entries: 1000
    ring_buffer_max_bytes: 2097152
    total_memory_budget: 209715200
    subscriber_queue_size: 500
    max_streams_per_user: 5
    max_subscribers_per_stream: 50
websocket:
    batch_interval_ms: 200
    max_message_size: 262144
    heartbeat_interval_s: 30
viewer:
    max_tabs_soft_limit: 10
    max_tabs_hard_limit: 20
    pause_queue_max_entries: 5000
    pause_queue_max_bytes: 5242880
    client_max_log_lines: 50000
display:
    default_theme: dark
    default_timestamp_format: local_absolute
