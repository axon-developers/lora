server:
    host: 0.0.0.0
    port: 8080
    cors_origins:
        - http://localhost:5173
        - http://127.0.0.1:5173
database:
    path: ./data/lora.db
clusters:
    - id: local-kind
      name: Local Kind (Podman Cluster)
      environment: development
      region: us-east-1
      regions:
        - us-east-1
        - us-east-2
      active_region: us-east-1
      managed_kubeconfig: false
      kubeconfig:
        path: ./data/kubeconfigs/local-kind.config
        context: kind-lora-test
      kconnect:
        enabled: false
        command: kconnect
        args: []
        auto_refresh: false
        env: {}
      health_check_interval: 15s
      enabled: true
streaming:
    default_tail_lines: 500
    ring_buffer_max_entries: 1000
    ring_buffer_max_bytes: 2097152
    total_memory_budget: 209715200
    subscriber_queue_size: 500
    max_streams_per_user: 5
    max_subscribers_per_stream: 50
websocket:
    batch_interval_ms: 200
    max_message_size: 262144
    heartbeat_interval_s: 30
viewer:
    max_tabs_soft_limit: 10
    max_tabs_hard_limit: 20
    pause_queue_max_entries: 5000
    pause_queue_max_bytes: 5242880
    client_max_log_lines: 50000
display:
    default_theme: dark
    default_timestamp_format: local_absolute
auth:
    enabled: false
    provider: none
    azure_ad:
        tenant_id: ""
        client_id: ""
        client_secret: ""
        redirect_url: ""
        scopes:
            - openid
            - profile
            - email
    jwt_secret: lora-secret-key-change-in-prod
    session_ttl: 24h
    admin_roles:
        - admin
s3_export:
    enabled: false
    bucket: test-bucket
    region: us-east-1
    prefix: lora-exports/
    endpoint: ""
    access_key_id: ""
    secret_access_key: ""
    use_iam_role: true
redaction:
    enabled: true
    rules:
        - id: aws-key
          name: AWS Access Key
          pattern: AKIA[0-9A-Z]{16}
          mask: '[REDACTED_AWS_KEY]'
          enabled: true
        - id: bearer-token
          name: Bearer Token
          pattern: Bearer\s+[a-zA-Z0-9_\-\.]{15,}
          mask: Bearer [REDACTED_TOKEN]
          enabled: true
        - id: password-key
          name: Password in URI / KV
          pattern: (?i)(password|passwd|secret)\s*[:=]\s*["']?([^"' \t\r\n]{4,})["']?
          mask: $1=[REDACTED]
          enabled: true
features:
    multi_container_merge: true
    pod_groups: true
    pod_events: true
