services:
  lora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lora-log-viewer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    environment:
      - LORA_SERVER_HOST=0.0.0.0
      - LORA_SERVER_PORT=8080

