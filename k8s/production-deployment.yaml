apiVersion: v1
kind: Namespace
metadata:
  name: lora-system
  labels:
    app.kubernetes.io/name: lora
    app.kubernetes.io/part-of: lora-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lora-sa
  namespace: lora-system
  labels:
    app.kubernetes.io/name: lora
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lora-cluster-reader
  labels:
    app.kubernetes.io/name: lora
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lora-cluster-reader-binding
  labels:
    app.kubernetes.io/name: lora
subjects:
  - kind: ServiceAccount
    name: lora-sa
    namespace: lora-system
roleRef:
  kind: ClusterRole
  name: lora-cluster-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lora-config
  namespace: lora-system
  labels:
    app.kubernetes.io/name: lora
data:
  lora-config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      cors_origins:
        - "*"
    database:
      path: "/data/lora.db"
    clusters:
      - id: "in-cluster"
        name: "Production (In-Cluster)"
        environment: "production"
        managed_kubeconfig: false
        kubeconfig:
          path: ""
          context: ""
        health_check_interval: "30s"
        enabled: true
    streaming:
      default_tail_lines: 500
      ring_buffer_max_entries: 5000
      ring_buffer_max_bytes: 5242880
      total_memory_budget: 209715200
      subscriber_queue_size: 500
      max_streams_per_user: 10
      max_subscribers_per_stream: 50
    websocket:
      batch_interval_ms: 200
      max_message_size: 262144
      heartbeat_interval_s: 30
    viewer:
      max_tabs_soft_limit: 10
      max_tabs_hard_limit: 20
      pause_queue_max_entries: 5000
      pause_queue_max_bytes: 5242880
      client_max_log_lines: 50000
    display:
      default_theme: "dark"
      default_timestamp_format: "local_absolute"
    redaction:
      enabled: true
      rules:
        - id: "aws-key"
          name: "AWS Access Key"
          pattern: 'AKIA[0-9A-Z]{16}'
          mask: "[REDACTED_AWS_KEY]"
          enabled: true
        - id: "bearer-token"
          name: "Bearer Token"
          pattern: 'Bearer\s+[A-Za-z0-9\-\._~\+\/]+=*'
          mask: "Bearer [REDACTED_TOKEN]"
          enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lora
  namespace: lora-system
  labels:
    app.kubernetes.io/name: lora
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lora
    spec:
      serviceAccountName: lora-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: lora
          image: lora:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/lora"]
          args: ["--config", "/app/configs/lora-config.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LORA_SERVER_HOST
              value: "0.0.0.0"
            - name: LORA_SERVER_PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs/lora-config.yaml
              subPath: lora-config.yaml
            - name: data-volume
              mountPath: /data
      volumes:
        - name: config-volume
          configMap:
            name: lora-config
        - name: data-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lora-service
  namespace: lora-system
  labels:
    app.kubernetes.io/name: lora
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: lora
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lora-ingress
  namespace: lora-system
  labels:
    app.kubernetes.io/name: lora
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "lora-service"
spec:
  rules:
    - host: lora.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lora-service
                port:
                  number: 8080

